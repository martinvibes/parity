<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffffff"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b6b6b"/>
    </marker>
  </defs>

  <rect width="980" height="600" fill="#000000"/>

  <rect x="40" y="18" width="18" height="18" rx="4" fill="#ffffff"/>
  <rect x="46.5" y="24.5" width="5" height="5" fill="#000000" transform="rotate(45 49 27)"/>
  <text x="68" y="33" fill="#ffffff" font-size="17" font-weight="700" letter-spacing="-0.4">Parity</text>
  <text x="128" y="33" fill="#6b6b6b" font-size="12.5">· one identity, checked three ways — in history, in the live book, and by the analyst</text>

  <!-- venue -->
  <rect x="40" y="58" width="900" height="54" rx="12" fill="#0a0a0a" stroke="rgba(255,255,255,0.15)"/>
  <text x="58" y="80" fill="#ffffff" font-size="13" font-weight="600">Bitget public spot API</text>
  <text x="58" y="99" fill="#6b6b6b" font-size="11" font-family="ui-monospace, Menlo, monospace">/api/v2/spot/market/tickers · /candles — no key, no account, no signing, CORS-open</text>
  <text x="922" y="87" fill="#525252" font-size="10.5" text-anchor="end">the only upstream</text>

  <!-- audit -->
  <rect x="40" y="150" width="900" height="126" rx="12" fill="#070707" stroke="rgba(255,255,255,0.10)"/>
  <text x="58" y="173" fill="#ffffff" font-size="10.5" font-weight="700" letter-spacing="1.3">THE AUDIT · PYTHON, OFFLINE — RUN ONCE, COMMITTED</text>
  <g>
    <rect x="56" y="186" width="276" height="74" rx="8" fill="#0d0d0d" stroke="rgba(255,255,255,0.15)"/>
    <text x="72" y="207" fill="#ffffff" font-family="ui-monospace, Menlo, monospace" font-size="11.5">scripts/fetch.py</text>
    <text x="72" y="227" fill="#8a8a8a" font-size="10.5">70 pages × 14 tickers, hourly</text>
    <text x="72" y="243" fill="#8a8a8a" font-size="10.5">→ data/*.json (gitignored)</text>

    <rect x="352" y="186" width="276" height="74" rx="8" fill="#0d0d0d" stroke="rgba(255,255,255,0.15)"/>
    <text x="368" y="207" fill="#ffffff" font-family="ui-monospace, Menlo, monospace" font-size="11.5">parity/core.py</text>
    <text x="368" y="227" fill="#8a8a8a" font-size="10.5">anchor on the 19:00 ET close</text>
    <text x="368" y="243" fill="#8a8a8a" font-size="10.5">8 dark bars · residual_bps()</text>

    <rect x="648" y="186" width="276" height="74" rx="8" fill="#0d0d0d" stroke="rgba(255,255,255,0.15)"/>
    <text x="664" y="207" fill="#ffffff" font-family="ui-monospace, Menlo, monospace" font-size="11.5">scripts/audit.py</text>
    <text x="664" y="227" fill="#8a8a8a" font-size="10.5">grades 15,852 observations</text>
    <text x="664" y="243" fill="#8a8a8a" font-size="10.5">persistence, costs, turnover</text>
  </g>
  <path d="M332 223 L352 223" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#g)"/>
  <path d="M628 223 L648 223" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#g)"/>

  <!-- artefact -->
  <rect x="330" y="308" width="320" height="46" rx="10" fill="#0d0d0d" stroke="rgba(255,255,255,0.3)"/>
  <text x="490" y="329" fill="#ffffff" font-family="ui-monospace, Menlo, monospace" font-size="12" text-anchor="middle">public/audit.json</text>
  <text x="490" y="345" fill="#8a8a8a" font-size="10" text-anchor="middle">the single source for every number on the site</text>

  <!-- site -->
  <rect x="40" y="392" width="900" height="182" rx="12" fill="#070707" stroke="rgba(255,255,255,0.10)"/>
  <text x="58" y="415" fill="#ffffff" font-size="10.5" font-weight="700" letter-spacing="1.3">THE SITE · NEXT.JS 16 / REACT 19</text>

  <g>
    <rect x="56" y="428" width="276" height="74" rx="8" fill="#0d0d0d" stroke="rgba(255,255,255,0.15)"/>
    <text x="72" y="449" fill="#ffffff" font-family="ui-monospace, Menlo, monospace" font-size="11.5">lib/desk.tsx</text>
    <text x="72" y="469" fill="#8a8a8a" font-size="10.5">re-reads the book every 45 s</text>
    <text x="72" y="485" fill="#8a8a8a" font-size="10.5">no server of ours in the path</text>

    <rect x="352" y="428" width="276" height="74" rx="8" fill="#0d0d0d" stroke="rgba(255,255,255,0.15)"/>
    <text x="368" y="449" fill="#ffffff" font-family="ui-monospace, Menlo, monospace" font-size="11.5">lib/parity.ts · read()</text>
    <text x="368" y="469" fill="#8a8a8a" font-size="10.5">the same residual, in the browser</text>
    <text x="368" y="485" fill="#8a8a8a" font-size="10.5">graded against each pair's p90</text>

    <rect x="648" y="428" width="276" height="74" rx="8" fill="#0d0d0d" stroke="rgba(255,255,255,0.15)"/>
    <text x="664" y="449" fill="#ffffff" font-size="11.5" font-weight="600">5 routes</text>
    <text x="664" y="469" fill="#8a8a8a" font-size="10.5">/ · /board · /research</text>
    <text x="664" y="485" fill="#8a8a8a" font-size="10.5">/evidence · /method</text>

    <rect x="56" y="514" width="572" height="44" rx="8" fill="#0a0a0a" stroke="rgba(255,255,255,0.15)"/>
    <text x="72" y="534" fill="#ffffff" font-family="ui-monospace, Menlo, monospace" font-size="11">app/api/ask  +  lib/tools.ts</text>
    <text x="72" y="550" fill="#8a8a8a" font-size="10.5">get_price · get_recent_candles · get_top_movers — four rounds of tool calls</text>

    <rect x="648" y="514" width="276" height="44" rx="8" fill="#0a0a0a" stroke="rgba(255,255,255,0.15)"/>
    <text x="664" y="534" fill="#ffffff" font-family="ui-monospace, Menlo, monospace" font-size="11">components/Chart.tsx</text>
    <text x="664" y="550" fill="#8a8a8a" font-size="10.5">lightweight-charts candlesticks</text>
  </g>

  <!-- flow -->
  <path d="M490 276 L490 308" stroke="#ffffff" stroke-width="1.4" marker-end="url(#w)"/>
  <path d="M490 354 L490 392" stroke="#ffffff" stroke-width="1.4" marker-end="url(#w)"/>
  <text x="502" y="378" fill="#6b6b6b" font-size="10">fetched as static JSON</text>

  <!-- live quotes down the left -->
  <path d="M40 85 L20 85 L20 465 L56 465" fill="none" stroke="#3a3a3a" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#g)"/>
  <text x="26" y="290" fill="#6b6b6b" font-size="9.5" transform="rotate(-90 26 290)" text-anchor="middle">live quotes, browser → venue</text>

  <!-- the analyst calls the same venue back -->
  <path d="M628 536 L638 536 L638 586 L966 586 L966 85 L940 85" fill="none" stroke="#3a3a3a" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#g)"/>
  <text x="956" y="300" fill="#6b6b6b" font-size="9.5" transform="rotate(-90 956 300)" text-anchor="middle">tool calls hit the same endpoints</text>
</svg>
